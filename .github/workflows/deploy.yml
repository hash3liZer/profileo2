name: Build & Deploy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: npm

      - name: Restore Next.js cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: |
          echo "GITHUB_API_KEY = ${{ secrets.PROFILEO2_PUBLIC_TOKEN }}" > .env
          echo "NEXT_PUBLIC_GITHUB_USERNAME = ${{ github.repository_owner }}" >> .env
          npm run build
          # GitHub Pages must not run Jekyll — it would drop the _next/* assets
          touch out/.nojekyll

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.PROFILEO2_PRIVATE_TOKEN }}
          branch: gh-pages
          folder: out
          repository-name: 'hash3liZer/hash3liZer.github.io'
          # Preserve the custom-domain CNAME that lives on the deploy branch
          clean: true
          clean-exclude: |
            CNAME
            
