<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06080b"/>
      <stop offset="1" stop-color="#0b0f14"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#12181f" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0 0 L7 3 L0 6 Z" fill="#5f6770"/>
    </marker>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto">
      <path d="M0 0 L7 3 L0 6 Z" fill="#4fe084"/>
    </marker>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="628" fill="none" stroke="#1b2027" stroke-width="2"/>

  <!-- top label -->
  <text x="64" y="86" fill="#5f6770" font-size="20" letter-spacing="4">RED TEAM // PHISHING // 2026</text>

  <!-- title -->
  <text x="64" y="150" fill="#f2f4f5" font-size="58" font-weight="700" letter-spacing="1">MITM: Bypassing 2FA</text>
  <text x="64" y="212" fill="#4fe084" font-size="40" font-weight="700">with Evilginx 3.3</text>

  <!-- flow diagram -->
  <g transform="translate(0,300)">
    <!-- victim -->
    <g transform="translate(120,60)">
      <rect x="-70" y="-46" width="140" height="150" rx="14" fill="#0e1217" stroke="#2a313b" stroke-width="2"/>
      <rect x="-46" y="-24" width="92" height="60" rx="6" fill="#06080b" stroke="#2a313b" stroke-width="2"/>
      <rect x="-58" y="40" width="116" height="10" rx="5" fill="#141921" stroke="#2a313b" stroke-width="2"/>
      <circle cx="0" cy="6" r="12" fill="none" stroke="#99a0a8" stroke-width="2"/>
      <path d="M-16 30 a16 12 0 0 1 32 0" fill="none" stroke="#99a0a8" stroke-width="2"/>
      <text x="0" y="86" fill="#99a0a8" font-size="20" text-anchor="middle">Victim</text>
    </g>

    <!-- evilginx proxy -->
    <g transform="translate(600,60)">
      <path d="M0 -84 L96 -34 L96 60 L0 118 L-96 60 L-96 -34 Z" fill="#0e1217" stroke="#4fe084" stroke-width="3"/>
      <path d="M0 -50 L40 -10 L0 30 L-40 -10 Z" fill="none" stroke="#4fe084" stroke-width="2.5"/>
      <text x="0" y="70" fill="#4fe084" font-size="22" font-weight="700" text-anchor="middle">EVILGINX</text>
      <text x="0" y="150" fill="#5f6770" font-size="17" text-anchor="middle">reverse proxy</text>
    </g>

    <!-- real site -->
    <g transform="translate(1064,60)">
      <path d="M-58 20 a34 34 0 0 1 6 -67 a40 40 0 0 1 77 8 a30 30 0 0 1 -6 59 Z" fill="#0e1217" stroke="#2a313b" stroke-width="2"/>
      <text x="0" y="4" fill="#99a0a8" font-size="20" text-anchor="middle">login</text>
      <text x="0" y="86" fill="#99a0a8" font-size="20" text-anchor="middle">Real Site</text>
    </g>

    <!-- arrows -->
    <line x1="212" y1="34" x2="486" y2="34" stroke="#5f6770" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="349" y="22" fill="#99a0a8" font-size="18" text-anchor="middle">credentials + 2FA</text>

    <line x1="712" y1="34" x2="978" y2="34" stroke="#5f6770" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="845" y="22" fill="#99a0a8" font-size="18" text-anchor="middle">proxied</text>

    <line x1="978" y1="96" x2="712" y2="96" stroke="#4fe084" stroke-width="3" marker-end="url(#arrowG)"/>
    <text x="845" y="122" fill="#4fe084" font-size="18" text-anchor="middle">session tokens</text>

    <line x1="486" y1="96" x2="212" y2="96" stroke="#4fe084" stroke-width="3" marker-end="url(#arrowG)"/>
    <text x="349" y="122" fill="#4fe084" font-size="18" text-anchor="middle">stolen &#128273;</text>
  </g>

  <text x="1136" y="596" fill="#5f6770" font-size="18" text-anchor="end">hash3liZer</text>
</svg>
